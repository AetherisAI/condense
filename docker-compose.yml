# Sift — dev/PoC topology: one instance on a single host, optionally reached over LAN.
#
# Inference that is NOT containerized here:
#   - Ollama serving bge-m3 runs on the HOST (Metal) and is reached by URL (EMBED_BASE_URL).
# The cross-encoder reranker IS containerized (the `reranker` service): Ollama can't serve rerankers.
#   - Turso / libSQL is cloud or an embedded-replica file — no container.
#
# Bind model (README "Security & privacy"): every published port defaults to loopback-only
# (`127.0.0.1`) — `docker compose up` is safe on a machine with a public IP out of the box.
# Set `API_HOST`/`WEB_HOST`/`RERANKER_HOST`/`TEI_HOST=0.0.0.0` (or a LAN interface IP) to opt in to LAN
# access from other machines on your LAN. Whichever you choose, the
# bearer token (`INGEST_TOKEN`/`AUTH_TOKENS`) still gates every write and query, and the hard
# rule stands either way: NEVER port-forward any of these ports to the public internet.
# Containers themselves still listen on 0.0.0.0 *inside* their own network namespace (see
# api.Dockerfile) — the actual host-facing bind happens here, at the `ports:` publish layer.

services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    environment:
      STORE_BACKEND: ${STORE_BACKEND:-libsql}
      # Defaults to an embedded-replica file under the named `sift-data` volume below —
      # `docker compose up` gets a working store with zero manual setup; point at a real
      # `libsql://...` URL (+ TURSO_AUTH_TOKEN) to use cloud Turso instead.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-file:/data/sift.db}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-} # host Ollama, e.g. http://host.docker.internal:11434/v1
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      # Batch size + bounded timeout phases + 429 retry budget — see .env.example. Listed here so
      # these .env keys actually reach the container (full env parity with .env.example).
      EMBED_BATCH_SIZE: ${EMBED_BATCH_SIZE:-64}
      EMBED_TIMEOUT_S: ${EMBED_TIMEOUT_S:-60.0}
      EMBED_CONNECT_TIMEOUT_S: ${EMBED_CONNECT_TIMEOUT_S:-5.0}
      EMBED_RETRY_ATTEMPTS: ${EMBED_RETRY_ATTEMPTS:-3}
      EMBED_QUERY_PREFIX: ${EMBED_QUERY_PREFIX:-}
      EMBED_DOCUMENT_PREFIX: ${EMBED_DOCUMENT_PREFIX:-}
      RERANK_STRATEGY: ${RERANK_STRATEGY:-crossencoder}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://reranker:8080}
      RERANK_MODEL: ${RERANK_MODEL:-bge-reranker-v2-m3}
      RERANK_TIMEOUT_S: ${RERANK_TIMEOUT_S:-120.0}
      RETRIEVE_K: ${RETRIEVE_K:-30}
      FINAL_K: ${FINAL_K:-1}
      SEARCH_MODE: ${SEARCH_MODE:-hybrid}
      VERSION_COLLAPSE_ENABLED: ${VERSION_COLLAPSE_ENABLED:-true}
      VERSION_SIMILARITY_THRESHOLD: ${VERSION_SIMILARITY_THRESHOLD:-0.8}
      RECAP_ENABLED: ${RECAP_ENABLED:-true}
      RECAP_CONTEXT_K: ${RECAP_CONTEXT_K:-3}
      RECAP_MAX_TOKENS: ${RECAP_MAX_TOKENS:-512}
      RECAP_TEMPERATURE: ${RECAP_TEMPERATURE:-0.3}
      SOURCE_SNIPPET_CHARS: ${SOURCE_SNIPPET_CHARS:-300}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # /v1/answer reference agent — see .env.example for what each knob does.
      ANSWER_TOOL_MODE: ${ANSWER_TOOL_MODE:-auto}
      ANSWER_MAX_TOOL_CALLS: ${ANSWER_MAX_TOOL_CALLS:-10}
      ANSWER_TIMEOUT_S: ${ANSWER_TIMEOUT_S:-120.0}
      ANSWER_MAX_TOKENS: ${ANSWER_MAX_TOKENS:-1024}
      ANSWER_HISTORY_MAX_TURNS: ${ANSWER_HISTORY_MAX_TURNS:-20}
      ANSWER_HISTORY_TTL_DAYS: ${ANSWER_HISTORY_TTL_DAYS:-30}
      ANSWER_AUTOTITLE_ENABLED: ${ANSWER_AUTOTITLE_ENABLED:-true}
      ANSWER_GROUNDING_DEFAULT: ${ANSWER_GROUNDING_DEFAULT:-strict}
      # OCR fallback (Mistral OCR; optional) — see .env.example.
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_BASE_URL: ${OCR_BASE_URL:-}
      OCR_MODEL: ${OCR_MODEL:-mistral-ocr-latest}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_TIMEOUT_S: ${OCR_TIMEOUT_S:-60.0}
      OCR_CONNECT_TIMEOUT_S: ${OCR_CONNECT_TIMEOUT_S:-5.0}
      CHUNK_SIZE: ${CHUNK_SIZE:-512}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-64}
      # Chunk tokenizer — see .env.example.
      CHUNK_TOKENIZER: ${CHUNK_TOKENIZER:-auto}
      # Degenerate-chunk floor — see .env.example.
      CHUNK_MIN_CHARS: ${CHUNK_MIN_CHARS:-24}
      # Parse guards — see .env.example.
      PARSE_MAX_XLSX_CELLS: ${PARSE_MAX_XLSX_CELLS:-2000000}
      PARSE_MAX_CHARS: ${PARSE_MAX_CHARS:-2000000}
      PARSE_TIMEOUT_S: ${PARSE_TIMEOUT_S:-60.0}
      # Toolbox `/v1/tools/*` surface — see .env.example.
      TOOLS_SEARCH_K: ${TOOLS_SEARCH_K:-8}
      TOOLS_SEARCH_MAX_K: ${TOOLS_SEARCH_MAX_K:-20}
      TOOLS_SEARCH_RERANK: ${TOOLS_SEARCH_RERANK:-false}
      INGEST_TOKEN: ${INGEST_TOKEN:?set a shared bearer token in .env}
      AUTH_TOKENS: ${AUTH_TOKENS:-}
      # CORS — allow-list for the Tauri desktop shell's webview; see .env.example.
      CORS_ORIGINS: ${CORS_ORIGINS:-tauri://localhost,http://tauri.localhost,https://tauri.localhost}
      # API_BIND/API_PORT are real `Settings` fields for the frozen-engine entry point
      # (packaging/sift_engine_entry.py) — parity requires them in this block too (see
      # tests/contract/test_config_env_parity.py). The containerized deployment is unaffected:
      # api.Dockerfile's CMD still hardcodes `--port 8000` inside the container, and the actual
      # host-facing bind for `docker compose up` is controlled below, at the `ports:` publish
      # layer, via API_HOST — not by these two.
      API_BIND: ${API_BIND:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    ports:
      # Loopback by default; set API_HOST=0.0.0.0 (or a LAN IP) to expose beyond this host.
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    # No hard dependency on the reranker: it downloads its model on first start, and until
    # it answers the API keeps the vector ranking instead of failing searches.
    # Linux: let the container reach host-side inference (Ollama/LLM) at
    # http://host.docker.internal:<port> just like on Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Named volume so the default embedded-replica file (TURSO_DATABASE_URL above) survives a
    # container recreate instead of starting empty every `docker compose up`.
    volumes:
      - sift-data:/data
    # Liveness probe — an unhealthy container is visible to `docker compose ps`/orchestrators
    # instead of silently accepting connections into a wedged process. curl is installed in
    # api.Dockerfile for this.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Compose-level memory ceiling (the container counterpart of scripts/run-engine.sh's
    # systemd MemoryMax) — a runaway ingest/embed spike gets killed by Docker instead of the
    # host OOMing.
    mem_limit: 3g

  web:
    # Built Vite UI served by nginx, which reverse-proxies the API surface
    # (/search, /ingest, /healthz) to the api container (web/nginx.conf).
    build:
      context: ./web
    ports:
      # Loopback by default; set WEB_HOST=0.0.0.0 (or a LAN IP) to expose beyond this host.
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api

  reranker:
    # Default cross-encoder reranker: bge-reranker-v2-m3, GGUF Q8_0, on llama.cpp's
    # llama-server: the same build and weights the desktop app provisions, multi-arch
    # (TEI's CPU image is amd64-only and never finishes warming up under emulation on Apple
    # silicon). On first start it downloads the GGUF (~636 MB) from Hugging Face into the
    # `reranker-models` volume, then reuses it. Serves TEI's /rerank request shape. CPU-only in
    # a container: ~18 s per 30-passage call on 4 vCPUs, ~1.5 GB, so TOOLS_SEARCH_RERANK stays
    # off by default. -ub/-b = the per-slot context (4096 / 4 = 1024 tokens): a query+passage
    # pair must fit one micro-batch, which a 512-token chunk plus a ~500-token query does.
    image: ghcr.io/ggml-org/llama.cpp:server-b9879@sha256:ce6bb66d9c0889501f5df2ca56e5af39eac506e98655330542492abbb74013eb
    command:
      - "-hf"
      - "gpustack/bge-reranker-v2-m3-GGUF:Q8_0"
      - "--reranking"
      - "-c"
      - "4096"
      - "-ub"
      - "1024"
      - "-b"
      - "1024"
      - "--parallel"
      - "4"
      - "--port"
      - "8080"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - reranker-models:/models
    ports:
      # Loopback by default; set RERANKER_HOST=0.0.0.0 (or a LAN IP) to expose beyond this host.
      - "${RERANKER_HOST:-127.0.0.1}:${RERANKER_PORT:-8082}:8080"
    # The image's own /health probe, with a start period that covers the first-start download.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  tei:
    # Alternative cross-encoder backend: the same bge-reranker-v2-m3 via Text Embeddings
    # Inference — the pick for a CUDA host (swap in a GPU image). Opt-in behind the `tei` profile:
    # `docker compose --profile tei up` + RERANK_BASE_URL=http://tei:80. Port 8081 leaves 8080
    # for the `web` service's nginx.
    profiles: ["tei"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "${RERANK_HF_MODEL:-BAAI/bge-reranker-v2-m3}"]
    ports:
      # Loopback by default; set TEI_HOST=0.0.0.0 (or a LAN IP) to expose beyond this host.
      - "${TEI_HOST:-127.0.0.1}:${TEI_PORT:-8081}:80"

  # Optional local LLM for recap. Alternatively point LLM_BASE_URL at host Ollama.
  # local-llm:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11435:11434"

volumes:
  # Backs the `api` service's default embedded-replica TURSO_DATABASE_URL — a fresh
  # `docker compose up` gets a working, persistent store with zero manual setup.
  sift-data:
  # The reranker's downloaded GGUF, so it's fetched once, not on every recreate.
  reranker-models:
